<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amazon Order Monitor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      width: 340px;
      box-sizing: border-box;
      color: #222;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #statusBox {
      font-size: 12px;
      background: #f6f6f6;
      border: 1px solid #e2e2e2;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    #statusBox b { font-weight: 600; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      border-radius: 10px;
      padding: 1px 8px;
      vertical-align: 1px;
    }
    .badge.on { background: #e6f4ea; color: #1e7e34; }
    .badge.off { background: #fdecea; color: #b02a37; }
    button {
      font-size: 12px;
      padding: 6px 10px;
      margin: 0 6px 6px 0;
      cursor: pointer;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #f7f7f7;
    }
    #msg { font-size: 11px; color: #555; margin-top: 4px; min-height: 14px; }
    hr { border: none; border-top: 1px solid #e2e2e2; margin: 10px 0; }
    .section-title { font-size: 12px; font-weight: 600; margin: 0 0 6px; }
    #csvContainer { margin-top: 8px; display: none; }
    #csvText {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      white-space: pre;
    }
    a { color: #0b5ed7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Amazon Order Monitor <span id="stateBadge" class="badge on">…</span></h1>

  <div id="statusBox">Loading status…</div>

  <div>
    <button id="checkNowBtn">Check now</button>
    <button id="openOrdersBtn">Open orders page</button>
    <button id="pauseResumeBtn">Pause</button>
    <a href="#" id="optionsLink">Options</a>
  </div>
  <div id="msg"></div>

  <hr />

  <p class="section-title">CSV export (current page)</p>
  <div>
    <button id="copyCsvBtn">Copy CSV to Clipboard</button>
    <button id="showCsvBtn">Show CSV Here</button>
  </div>
  <div id="csvStatus" style="font-size:11px;color:#555;margin-top:4px;"></div>

  <div id="csvContainer">
    <textarea id="csvText" readonly></textarea>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
