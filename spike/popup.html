<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AOM Spike</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; width: 420px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    fieldset { border: 1px solid #ccc; margin: 0 0 8px; padding: 6px 8px; }
    legend { font-size: 12px; font-weight: 600; }
    button { font-size: 12px; padding: 4px 8px; margin: 2px 4px 2px 0; cursor: pointer; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; font-size: 12px; margin: 2px 0; }
    #out { font-family: monospace; font-size: 11px; white-space: pre-wrap; background: #f5f5f5; padding: 6px; max-height: 260px; overflow: auto; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>AOM Spike — capability experiments</h1>

  <fieldset>
    <legend>A — jittered alarms</legend>
    <button id="startA">Start loop</button>
    <button id="stopA">Stop loop</button>
  </fieldset>

  <fieldset>
    <legend>B — tab round trip (open https://example.com first)</legend>
    <button id="runB">Run tab check</button>
  </fieldset>

  <fieldset>
    <legend>C — notification buttons</legend>
    <button id="runC">Show notification</button>
  </fieldset>

  <fieldset>
    <legend>D — Apps Script relay (deploy apps-script/Code.gs first)</legend>
    <input type="text" id="relayUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    <input type="password" id="relaySecret" placeholder="shared secret" />
    <button id="saveD">Save</button>
    <button id="runD">Send test</button>
    <button id="runDwrong">Send with WRONG secret</button>
  </fieldset>

  <fieldset>
    <legend>Log</legend>
    <button id="dump">Dump log</button>
    <button id="clear">Clear log</button>
    <button id="idle">Idle state</button>
  </fieldset>

  <div id="out">(output)</div>

  <script src="popup.js"></script>
</body>
</html>
